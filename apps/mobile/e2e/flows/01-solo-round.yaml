# Guest solo game: Grand Tichu -> pass 3 -> first plays. Plays on whatever server the app was
# bundled for (EXPO_PUBLIC_SERVER_URL; use the local QA server for simulator QA).
appId: dev.aegist.titsu
---
# Guest run: clearState keeps the keychain session from earlier flows, so drop it too.
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "TICHU"
    timeout: 20000
- tapOn:
    id: "nickname"
- eraseText
- inputText: "Maestro"
- tapOn: "Done"
- takeScreenshot: 01-lobby
- tapOn: "Solo Game"
- tapOn:
    id: "play-solo"
- extendedWaitUntil:
    visible: "Grand Tichu?"
    timeout: 20000
- takeScreenshot: 02-grand-tichu
- tapOn: "Pass"
- extendedWaitUntil:
    visible: "Pass three cards"
    timeout: 30000
- tapOn:
    id: "hand-0"
- tapOn:
    id: "hand-1"
- tapOn:
    id: "hand-2"
- takeScreenshot: 03-passing
- tapOn: "Pass cards"
- extendedWaitUntil:
    visible: "Your turn.*|.*'s turn"
    timeout: 60000
- takeScreenshot: 04-table
