# Scene 04: waiting room with friends joining. Needs `shots-server.sh friends` running
# (Μαρία, Kostas Lim, Panikos online, auto-accepting invites). Friends are listed by display
# name (Kostas Lim, Loukia, Panikos, Ελένη Χ, Μαρία, Χρίστος); rightOf is not row-bound, so each
# Invite tap also needs above/below.
# Do NOT start the game: the friend bots never play a card. Leave after capturing (shoot.sh does).
appId: dev.aegist.titsu
---
- runFlow: sub/sign-in-showcase.yaml
- runFlow: sub/set-language.yaml
- tapOn: "Friends|Φίλοι"
- extendedWaitUntil:
    visible: "Μαρία · Online"
    timeout: 15000
- extendedWaitUntil:
    visible: "Kostas Lim · Online"
    timeout: 15000
- tapOn:
    text: "Invite|Πρόσκληση"
    rightOf: "Μαρία · Online"
    below: "Panikos · Online"
- extendedWaitUntil:
    visible: "(Seat|Θέση) [0-9], Μαρία"
    timeout: 20000
- tapOn: "Invite friend|Πρόσκληση φίλου"
- extendedWaitUntil:
    visible: "Kostas Lim · Online"
    timeout: 15000
- tapOn:
    text: "Invite|Πρόσκληση"
    rightOf: "Kostas Lim · Online"
    above: "Loukia · Offline"
- extendedWaitUntil:
    visible: "__wait_for_invite__"
    timeout: 1500
    optional: true
- tapOn: "Back|Πίσω"
- extendedWaitUntil:
    visible: "(Seat|Θέση) [0-9], Kostas Lim"
    timeout: 20000
- waitForAnimationToEnd
