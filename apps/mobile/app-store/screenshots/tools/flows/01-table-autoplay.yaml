# Scenes 01 + 05: from the Grand Tichu screen (run 02 first), pass Grand Tichu, pass 3 cards,
# then autoplay the round with Hint while shoot.sh runs a capture burst. Pick the best frames:
#   01 hero  = trick with the Dragon / Phoenix / a bomb on the table, full hand
#   05 gods  = the Dragon give sheet ("Give the trick to an opponent": Bot Zeus / Bot Apollo)
#              or the Mahjong wish grid, with the bots' names visible
appId: dev.aegist.titsu
---
- tapOn: "Pass"
- extendedWaitUntil:
    visible: "Pass three cards"
    timeout: 30000
- tapOn:
    id: "hand-0"
- tapOn:
    id: "hand-6"
- tapOn:
    id: "hand-13"
- tapOn: "Pass cards"
- extendedWaitUntil:
    visible: "Your turn.*|.*'s turn|.*leads|Your lead"
    timeout: 60000
- runFlow: sub/autoplay-until-round-over.yaml
