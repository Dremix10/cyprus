# Play the human seat with the solo Hint button until the round (or game) ends, in EN or EL.
# Same loop as e2e/flows/05-quick-game.yaml. The wish and Dragon sheets are HELD for ~4 s so a
# capture burst running in parallel catches them (scene 05 "gods").
appId: dev.aegist.titsu
---
- repeat:
    while:
      notVisible: "Round over|Τέλος Γύρου|Victory!|Defeat|Tie|Νίκη!|Ήττα|Ισοπαλία"
    times: 200
    commands:
      - runFlow:
          when:
            visible:
              id: "wish-sheet"
          commands:
            - extendedWaitUntil:
                visible: "__hold_for_capture__"
                timeout: 4000
                optional: true
            - tapOn:
                id: "wish-14"
      - runFlow:
          when:
            visible:
              id: "dragon-sheet"
          commands:
            - extendedWaitUntil:
                visible: "__hold_for_capture__"
                timeout: 4000
                optional: true
            - tapOn:
                id: "dragon-give-0"
      - runFlow:
          when:
            visible: "Skip round|Παράλειψη γύρου"
          commands:
            - tapOn: "Skip round|Παράλειψη γύρου"
      # Nothing can beat the trick: pass straight away (Hint would only say "pass" after a 10 s wait).
      - runFlow:
          when:
            visible: "(Your turn · nothing beats it, pass|Η σειρά σου · δεν κερδίζεις, πάσο).*"
          commands:
            - tapOn:
                id: "pass"
            - extendedWaitUntil:
                notVisible: "(Your turn · nothing beats it, pass|Η σειρά σου · δεν κερδίζεις, πάσο).*"
                timeout: 4000
                optional: true
      - runFlow:
          when:
            visible:
              id: "hint"
          commands:
            - tapOn:
                id: "hint"
            - extendedWaitUntil:
                visible: "(Play|Παίξε) [0-9]+"
                timeout: 10000
                optional: true
            # Pass branch first: after a play the Pass button lingers until game:state lands.
            - runFlow:
                when:
                  notVisible: "(Play|Παίξε) [0-9]+"
                  visible:
                    id: "pass"
                commands:
                  - tapOn:
                      id: "pass"
            - runFlow:
                when:
                  visible: "(Play|Παίξε) [0-9]+"
                commands:
                  - tapOn:
                      id: "play"
      - extendedWaitUntil:
          visible:
            id: "hint"
          timeout: 4000
          optional: true
