<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyprus Admin Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .topbar { background: #1a1a2e; border-bottom: 1px solid #2a2a4a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .topbar h1 { font-size: 1.3rem; color: #c9a84c; }
  .topbar .links { display: flex; gap: 1rem; align-items: center; }
  .topbar a { color: #888; text-decoration: none; font-size: 0.85rem; }
  .topbar a:hover { color: #c9a84c; }
  .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 1.2rem; }
  .stat-card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 1.8rem; font-weight: 700; color: #c9a84c; margin-top: 0.3rem; }
  .tabs { display: flex; gap: 0; margin-bottom: 0; border-bottom: 1px solid #2a2a4a; flex-wrap: wrap; }
  .tab { padding: 0.7rem 1.2rem; background: transparent; border: none; color: #888; cursor: pointer; font-size: 0.9rem; border-bottom: 2px solid transparent; }
  .tab:hover { color: #ccc; }
  .tab.active { color: #c9a84c; border-bottom-color: #c9a84c; }
  .panel { display: none; }
  .panel.active { display: block; }
  .table-wrap { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 0 0 10px 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { background: #16213e; color: #c9a84c; padding: 0.7rem 1rem; text-align: left; font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 0.6rem 1rem; border-top: 1px solid #1f1f35; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: #16213e33; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
  .badge-green { background: #1a3a2a; color: #4caf50; }
  .badge-red { background: #3a1a1a; color: #e74c3c; }
  .badge-blue { background: #1a2a3a; color: #42a5f5; }
  .badge-yellow { background: #3a3a1a; color: #c9a84c; }
  .badge-muted { background: #262638; color: #aaa; }
  .refresh-info { color: #555; font-size: 0.75rem; }
  #last-refresh { color: #888; }
  .empty { padding: 2rem; text-align: center; color: #555; }
  .empty a { color: #c9a84c; font-weight: 700; }
  .query-wrap { padding: 1rem; }
  .query-wrap textarea { width: 100%; min-height: 80px; background: #12121f; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 0.7rem; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85rem; resize: vertical; }
  .query-wrap textarea:focus { outline: none; border-color: #c9a84c; }
  .query-bar { display: flex; gap: 0.5rem; margin: 0.7rem 0; align-items: center; flex-wrap: wrap; }
  .query-bar button { width: auto; padding: 0.5rem 1.2rem; font-size: 0.85rem; }
  .query-bar .btn-secondary { background: #2a2a4a; color: #ccc; }
  .query-bar .btn-secondary:hover { background: #3a3a5a; }
  .query-info { color: #888; font-size: 0.8rem; }
  .query-error { color: #e74c3c; font-size: 0.85rem; padding: 0.7rem; background: #2a1515; border-radius: 6px; margin-top: 0.5rem; }
  .query-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
  .chip { padding: 0.25rem 0.6rem; background: #16213e; border: 1px solid #2a2a4a; border-radius: 4px; font-size: 0.75rem; color: #888; cursor: pointer; }
  .chip:hover { border-color: #c9a84c; color: #c9a84c; }
  .chip .count { color: #555; margin-left: 0.3rem; }
  .user-form { padding: 1.5rem; max-width: 480px; }
  .user-form label { display: block; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.3rem; }
  .user-form input { width: 100%; background: #12121f; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.9rem; margin-bottom: 1rem; }
  .user-form input:focus { outline: none; border-color: #c9a84c; }
  .user-form button { padding: 0.6rem 1.4rem; font-size: 0.9rem; background: #c9a84c; color: #0f0f1a; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .user-form button:hover { background: #d4b65c; }
  .user-form button:disabled { opacity: 0.5; cursor: not-allowed; }
  .form-msg { margin-top: 0.5rem; padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.85rem; }
  .form-msg.success { background: #1a3a2a; color: #4caf50; }
  .form-msg.error { background: #2a1515; color: #e74c3c; }
  .reports-wrap { padding: 1rem; display: grid; gap: 1rem; }
  .reports-summary { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.8rem; }
  .reports-heading { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .reports-heading h2 { color: #c9a84c; font-size: 1.05rem; }
  .reports-hint { color: #888; font-size: 0.8rem; }
  .report-card { background: #12121f; border: 1px solid #2a2a4a; border-radius: 8px; padding: 1rem; display: grid; gap: 0.8rem; }
  .report-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  .report-title { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .report-title strong { color: #f0f0f0; }
  .report-meta { color: #888; font-size: 0.78rem; margin-top: 0.25rem; }
  .fixed-pill { background: #1a3a2a; color: #66d38a; border: 1px solid rgba(102, 211, 138, 0.35); border-radius: 4px; padding: 0.16rem 0.5rem; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
  .fixed-pill:hover { border-color: #66d38a; color: #8be0a7; }
  .fixed-note { background: #111f18; border: 1px solid rgba(102, 211, 138, 0.24); border-radius: 8px; padding: 0.85rem 1rem; display: grid; gap: 0.55rem; }
  .fixed-note[hidden] { display: none; }
  .fixed-note-title { color: #66d38a; font-weight: 700; font-size: 0.85rem; }
  .fixed-note-body { color: #d7e8dc; font-size: 0.82rem; line-height: 1.45; }
  .fixed-note-meta { color: #93aa9a; font-size: 0.75rem; }
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.6rem; }
  .report-field { background: #18182a; border: 1px solid #24243e; border-radius: 6px; padding: 0.55rem 0.65rem; min-width: 0; }
  .report-field-label { color: #777; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 0.25rem; }
  .report-field-value { color: #ddd; font-size: 0.82rem; overflow-wrap: anywhere; }
  .report-review { display: grid; grid-template-columns: minmax(150px, 220px) minmax(240px, 1fr) auto; gap: 0.6rem; align-items: start; }
  .report-review select, .report-review textarea { width: 100%; background: #0f0f1a; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 0.55rem 0.65rem; font-size: 0.82rem; }
  .report-review textarea { min-height: 38px; resize: vertical; }
  .report-review button, .report-context-btn { background: #c9a84c; color: #0f0f1a; border: none; border-radius: 6px; padding: 0.55rem 0.9rem; cursor: pointer; font-weight: 600; }
  .report-context-btn { width: fit-content; }
  .review-msg { color: #888; font-size: 0.75rem; min-height: 1rem; }
  .report-context { border-top: 1px solid #2a2a4a; padding-top: 0.8rem; }
  .report-test { background: #12121f; border: 1px solid #2a2a4a; border-radius: 8px; padding: 1rem; display: grid; gap: 0.8rem; }
  .report-test-bar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .report-test-bar button, .replay-controls button { background: #c9a84c; color: #0f0f1a; border: none; border-radius: 6px; padding: 0.55rem 0.9rem; cursor: pointer; font-weight: 700; }
  .report-test-bar button:disabled, .replay-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
  .report-test-bar select { min-width: min(100%, 420px); flex: 1; background: #0f0f1a; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 0.55rem 0.65rem; }
  .report-test-chooser[hidden] { display: none; }
  .replay-room { display: grid; gap: 0.8rem; }
  .replay-stage { border: 1px solid #2a2a4a; border-radius: 8px; background: #0f0f1a; padding: 1rem; display: grid; gap: 0.8rem; }
  .replay-stage.reported { border-color: #c9a84c; box-shadow: 0 0 0 1px rgba(201, 168, 76, 0.25) inset; }
  .replay-stage.legacy { border-color: #6d5a2b; }
  .replay-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  .replay-title { display: grid; gap: 0.2rem; }
  .replay-title strong { color: #f0f0f0; }
  .replay-sub { color: #888; font-size: 0.78rem; }
  .replay-controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .replay-move { background: #18182a; border: 1px solid #24243e; border-radius: 6px; padding: 0.75rem; }
  .replay-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.5rem; }
  .replay-game-room { background: radial-gradient(circle at center, #1d5137 0, #123624 55%, #0b2418 100%); border: 1px solid #31553f; border-radius: 10px; padding: 1rem; box-shadow: inset 0 0 40px rgba(0,0,0,0.35); display: grid; gap: 0.75rem; }
  .replay-score-strip { display: flex; justify-content: space-between; align-items: center; gap: 0.7rem; flex-wrap: wrap; color: #ddd; font-size: 0.8rem; }
  .replay-board { min-height: 560px; display: grid; grid-template-columns: minmax(190px, 0.85fr) minmax(300px, 1.3fr) minmax(190px, 0.85fr); grid-template-rows: auto minmax(220px, 1fr) auto; grid-template-areas: ". top ." "left center right" ". bottom ."; gap: 0.75rem; align-items: center; }
  .replay-seat { background: rgba(15,15,26,0.82); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.65rem; min-width: 0; display: grid; gap: 0.45rem; }
  .replay-seat.pos-0 { grid-area: bottom; }
  .replay-seat.pos-1 { grid-area: left; }
  .replay-seat.pos-2 { grid-area: top; }
  .replay-seat.pos-3 { grid-area: right; }
  .replay-seat.current { border-color: #42a5f5; box-shadow: 0 0 0 1px rgba(66,165,245,0.25) inset; }
  .replay-seat.reported-player { border-color: #c9a84c; box-shadow: 0 0 0 1px rgba(201,168,76,0.25) inset; }
  .replay-seat.actor { background: rgba(28, 34, 52, 0.9); }
  .replay-seat-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; color: #f0f0f0; font-size: 0.82rem; }
  .replay-seat-name { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .seat-dot { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: #2a2a4a; flex: 0 0 auto; }
  .seat-dot.team-a { background: #42a5f5; }
  .seat-dot.team-b { background: #c9a84c; }
  .replay-seat-sub { color: #aaa; font-size: 0.72rem; overflow-wrap: anywhere; }
  .replay-seat-hand { display: flex; flex-wrap: wrap; gap: 0.22rem; min-height: 4rem; align-content: flex-start; }
  .replay-seat-hand.known { gap: 0.1rem; }
  .replay-seat-hand.known .mini-card { margin-right: -0.65rem; }
  .replay-seat-hand.known .mini-card:last-child { margin-right: 0; }
  .replay-table-center { grid-area: center; align-self: stretch; min-width: 0; background: rgba(15,15,26,0.72); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 1rem; display: grid; gap: 0.8rem; align-content: center; justify-items: center; }
  .replay-table-title { color: #c9a84c; font-size: 0.9rem; font-weight: 700; text-align: center; }
  .replay-table-sub { color: #aaa; font-size: 0.76rem; text-align: center; }
  .replay-trick-pile { width: 100%; display: grid; gap: 0.55rem; }
  .replay-trick-play { display: grid; grid-template-columns: minmax(4.5rem, auto) minmax(0, 1fr); gap: 0.45rem; align-items: center; justify-content: center; }
  .replay-trick-play.latest { background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.28); border-radius: 8px; padding: 0.45rem; }
  .trick-seat-label { color: #ddd; font-size: 0.76rem; text-align: right; }
  .trick-card-row { display: flex; flex-wrap: wrap; gap: 0.18rem; min-width: 0; }
  .pass-chip { display: inline-flex; align-items: center; justify-content: center; min-height: 2rem; padding: 0.2rem 0.7rem; border-radius: 999px; border: 1px solid #444; color: #aaa; background: #151526; font-size: 0.78rem; font-weight: 700; }
  .mini-card { width: 42px; height: 58px; background: #fff; border: 2px solid #ddd; border-radius: 6px; position: relative; color: #333; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.28); flex: 0 0 auto; }
  .mini-card.unknown-card { background: linear-gradient(135deg, #b83329, #7d3ba0); border-color: #7f1d2c; color: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; font-size: 0.68rem; }
  .mini-card.special-card { overflow: hidden; }
  .mini-card .card-corner { position: absolute; top: 3px; left: 5px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .mini-card .card-rank { font-size: 0.65rem; }
  .mini-card .card-suit { font-size: 0.55rem; }
  .mini-card .card-center { height: 100%; display: flex; align-items: center; justify-content: center; }
  .mini-card .card-suit-lg { font-size: 1rem; }
  .special-art { font-size: 1.05rem; line-height: 1; }
  .unknown-count { color: #ddd; font-size: 0.72rem; text-shadow: 0 1px 2px rgba(0,0,0,0.45); }
  .replay-evidence { background: #18182a; border: 1px solid #24243e; border-radius: 6px; padding: 0.75rem; display: grid; gap: 0.6rem; }
  .replay-evidence-head { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; flex-wrap: wrap; color: #f0f0f0; font-size: 0.85rem; }
  .replay-evidence details { border-top: 1px solid #24243e; padding-top: 0.55rem; }
  .replay-evidence summary { color: #c9a84c; cursor: pointer; font-size: 0.8rem; width: fit-content; }
  .raw-json { margin-top: 0.55rem; max-height: 220px; overflow: auto; background: #0f0f1a; border: 1px solid #333; border-radius: 6px; padding: 0.7rem; color: #ccc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.72rem; line-height: 1.45; white-space: pre-wrap; }
  .card-list { display: flex; flex-wrap: wrap; gap: 0.25rem; min-height: 1.5rem; }
  .card-chip { background: #0f0f1a; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.72rem; padding: 0.16rem 0.32rem; }
  .card-chip.unknown { color: #888; border-style: dashed; }
  .timeline { display: grid; gap: 0.45rem; }
  .timeline-event { display: grid; grid-template-columns: 3.5rem 7rem minmax(0, 1fr); gap: 0.6rem; align-items: start; background: #18182a; border: 1px solid #24243e; border-radius: 6px; padding: 0.65rem; }
  .timeline-event.reported { border-color: #c9a84c; background: #211d12; }
  .timeline-offset { color: #888; font-size: 0.75rem; font-weight: 700; }
  .timeline-type { color: #c9a84c; font-size: 0.78rem; font-weight: 700; }
  .timeline-body { min-width: 0; }
  .timeline-main { color: #e0e0e0; font-size: 0.84rem; overflow-wrap: anywhere; }
  .timeline-sub { color: #888; font-size: 0.74rem; margin-top: 0.25rem; overflow-wrap: anywhere; }
  @media (max-width: 760px) {
    .report-review { grid-template-columns: 1fr; }
    .replay-board { min-height: 0; grid-template-columns: 1fr; grid-template-rows: auto; grid-template-areas: "top" "left" "center" "right" "bottom"; }
    .replay-trick-play { grid-template-columns: 1fr; }
    .trick-seat-label { text-align: left; }
    .timeline-event { grid-template-columns: 1fr; }
  }
</style>
</head><body>
<div class="topbar">
  <h1>Cyprus Admin</h1>
  <div class="links">
    <span class="refresh-info">Updated: <span id="last-refresh">-</span></span>
    <a href="#" onclick="refresh(true); return false;">Refresh</a>
    <a href="/admin/logout">Logout</a>
  </div>
</div>
<div class="container">
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab active" data-tab="connections" onclick="showTab('connections')">Connections</button>
    <button class="tab" data-tab="players" onclick="showTab('players')">Players</button>
    <button class="tab" data-tab="games" onclick="showTab('games')">Games</button>
    <button class="tab" data-tab="events" onclick="showTab('events')">Events</button>
    <button class="tab" data-tab="botreports" onclick="showTab('botreports')">Reported Plays</button>
    <button class="tab" data-tab="requests" onclick="showTab('requests')">HTTP Requests</button>
    <button class="tab" data-tab="ips" onclick="showTab('ips')">Top IPs</button>
    <button class="tab" data-tab="users" onclick="showTab('users')">Users</button>
    <button class="tab" data-tab="query" onclick="showTab('query')">Query</button>
  </div>
  <div class="table-wrap">
    <div id="panel-connections" class="panel active"></div>
    <div id="panel-players" class="panel"></div>
    <div id="panel-games" class="panel"></div>
    <div id="panel-events" class="panel"></div>
    <div id="panel-botreports" class="panel"></div>
    <div id="panel-requests" class="panel"></div>
    <div id="panel-ips" class="panel"></div>
    <div id="panel-users" class="panel"></div>
    <div id="panel-query" class="panel"></div>
  </div>
</div>
<script>
const api = async path => {
  const res = await fetch('/admin/api/' + path, { headers: { Accept: 'application/json' } });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* response was not JSON */ }
  if (!res.ok) throw new Error(data?.error || text?.slice(0, 120) || ('HTTP ' + res.status));
  return data;
};
let currentTab = 'connections';
const LIVE_ADMIN_URL = 'https://aegist.dev/admin';
const isFilePreview = window.location.protocol === 'file:';
let replayState = null;
const REVIEW_LABELS = {
  unreviewed: 'Unreviewed',
  valid_mistake: 'Valid mistake',
  probably_ok: 'Probably OK',
  unclear: 'Unclear',
  needs_replay: 'Needs replay',
  duplicate: 'Duplicate',
};
const FIXED_REPORTS = [
  {
    ids: [28, 14, 10, 9, 7, 6],
    title: 'Phoenix lead waste fixed',
    summary: 'Bots now avoid leading a bare Phoenix when any normal lead exists, including partner-Tichu setup leads. Phoenix can still be used as the final card or inside a real combination.',
    changed: 'Added Phoenix-single filtering before lead selection and regression tests for the reported partner-Tichu shapes.',
  },
  {
    ids: [24, 23, 12, 11],
    title: 'Bomb lead waste fixed',
    summary: 'Bombs are no longer treated as ordinary lead multi-card combos. A bot leads a bomb only when it is the only legal lead, an endgame closeout, or there is a real urgent reason.',
    changed: 'Split bomb candidates from regular lead candidates and added explicit bomb-lead reason tags.',
  },
  {
    ids: [22, 1],
    title: 'Phoenix follow waste fixed',
    summary: 'Bots now avoid spending Phoenix on low or medium single follows when a normal card can win the trick, unless Phoenix is the only useful stop or the bot is in late endgame.',
    changed: 'Added a wasteful-Phoenix follow filter before smart selection and Monte Carlo candidate selection.',
  },
  {
    ids: [26],
    title: 'Partner-out pass fixed',
    summary: 'When partner is winning but already out, a short-handed bot now keeps racing instead of passing and trapping itself.',
    changed: 'Added a partner-out endgame exception before the partner-winning pass rule.',
  },
  {
    ids: [25],
    title: 'Partner Mahjong wish protection fixed',
    summary: 'When partner leads Mahjong with an active wish, the bot now helps satisfy/protect the wish with the cheapest normal single instead of passively giving up the setup.',
    changed: 'Threaded wish context through follow decisions and added a partner-Mahjong wish branch.',
  },
  {
    ids: [21],
    title: 'Triple-breaking endgame lead fixed',
    summary: 'Hard bots now use a small-hand lead plan before Monte Carlo, so they keep made triples/pairs together instead of leading one card from the set.',
    changed: 'Added an endgame lead planner that scores the remaining hand after each candidate lead.',
  },
  {
    ids: [20],
    title: 'Low-card opponent single pass fixed',
    summary: 'Hard bots no longer let a low-card opponent keep initiative for free on a cheap single when the bot has a cheap normal answer.',
    changed: 'Added a pre-Monte-Carlo low-single initiative block that prefers loose low normal singles.',
  },
  {
    ids: [31, 13],
    title: 'Ace-vs-Tichu lead waste fixed',
    summary: 'Bots no longer burn an Ace just because an opponent has a distant Tichu or Grand Tichu call. Ace pressure is reserved for immediate danger or very short bot hands.',
    changed: 'Restricted the Ace-vs-Tichu branch and falls back to safer pressure such as King leads or normal plan leads.',
  },
  {
    ids: [30],
    title: 'Race lead shape fixed',
    summary: 'When opponents are nearly out, bots now prefer stronger multi-card race leads like consecutive pairs instead of leaking a tiny pair first.',
    changed: 'Added a race lead planner that scores candidates by cards shed and remaining turns to go out.',
  },
  {

function showTab(name) {

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

function esc(s) { if (s == null) return '-'; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function parseJson(raw) { try { return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
function ago(dt) {
  if (!dt) return '-';
  const ms = Date.now() - new Date(dt + 'Z').getTime();
  if (ms < 60000) return Math.floor(ms/1000) + 's ago';
  if (ms < 3600000) return Math.floor(ms/60000) + 'm ago';
  if (ms < 86400000) return Math.floor(ms/3600000) + 'h ago';
  return Math.floor(ms/86400000) + 'd ago';
}

function reviewBadgeClass(status) {
  if (status === 'valid_mistake') return 'badge-red';
  if (status === 'probably_ok') return 'badge-green';
  if (status === 'unclear' || status === 'needs_replay') return 'badge-blue';
  if (status === 'duplicate') return 'badge-red';
  return 'badge-yellow';
}

function cardId(c) {
  if (typeof c === 'string') return c;
  return c?.id || '?';
}

function cardsText(cards) {
  return Array.isArray(cards) ? cards.map(cardId).join(' ') : '';
}

function cardsFromCombination(combination) {
  return Array.isArray(combination?.cards) ? combination.cards.map(cardId) : [];
}

function summarizeEventRow(row) {
  const raw = row.event_data ?? row.data;
  const data = parseJson(raw);
  if (row.event_type === 'PASS') return 'Pass';
  if (data?.combination) {
    return (data.combination.type || row.event_type) + ': ' + cardsText(data.combination.cards);
  }
  if (row.event_type === 'WISH_MADE') return 'Wish ' + esc(data?.rank ?? '?');
  if (row.event_type === 'WISH_FULFILLED') return 'Wish fulfilled';
  if (row.event_type === 'DRAGON_GIVEN') return 'Dragon given to P' + esc(data?.to ?? '?');
  if (row.event_type === 'PLAYER_OUT') return 'Player out' + (data?.place ? ' #' + data.place : '');
  if (row.event_type === 'ROUND_END') return 'Round ended ' + esc(data?.roundScores ? data.roundScores.join(' - ') : '');
  if (row.event_type === 'GAME_OVER') return 'Game over';
  return row.event_type;
}

function botInfoFromRow(row) {
  const data = parseJson(row.event_data ?? row.data);
  return data?.bot || null;
}

function formatPlayerMap(value) {
  if (!value || typeof value !== 'object') return '-';
  return [0, 1, 2, 3].map(pos => 'P' + pos + ': ' + (value[pos] ?? value[String(pos)] ?? '?')).join(' · ');
}

function formatPlayerList(value) {
  return Array.isArray(value) && value.length ? value.map(pos => 'P' + pos).join(' -> ') : '-';
}

function formatTrickPlays(plays) {

    ? plays.map(p => 'P' + p.position + '[' + (Array.isArray(p.cards) ? p.cards.join(' ') : '-') + ']').join(' -> ')

}

function formatTrickTop(top) {

  return [top.type, top.rank != null ? 'rank ' + top.rank : '', top.length != null ? 'len ' + top.length : ''].filter(Boolean).join(' · ');
}

const SUIT_SYMBOLS = { JADE: '♣', PAGODA: '♦', STAR: '♥', SWORD: '♠' };
const SUIT_COLORS = { JADE: '#2ecc71', PAGODA: '#3498db', STAR: '#e74c3c', SWORD: '#222' };
const SPECIAL_CARDS = {
  MAHJONG: { label: '1', icon: '1', bg: '#f5f5dc', color: '#333' },
  DOG: { label: 'Dog', icon: 'Dog', bg: '#d4c4a8', color: '#333' },
  PHOENIX: { label: 'Ph', icon: 'Ph', bg: '#ffeaa7', color: '#c0392b' },
  DRAGON: { label: 'Dr', icon: 'Dr', bg: '#2c3e50', color: '#fff' },
};

function rankLabel(rank) {
  const n = Number(rank);
  if (n === 11) return 'J';
  if (n === 12) return 'Q';
  if (n === 13) return 'K';
  if (n === 14) return 'A';
  return String(rank);
}

function parseCardId(id) {
  if (!id || id === '?') return null;
  if (SPECIAL_CARDS[id]) return { type: 'special', specialType: id };
  const parts = String(id).split('_');
  if (parts.length !== 2) return null;
  const suit = parts[0];
  const rank = Number(parts[1]);
  if (!SUIT_SYMBOLS[suit] || !Number.isFinite(rank)) return null;
  return { type: 'normal', suit, rank };
}

function renderMiniCard(id) {
  const card = parseCardId(id);
  if (!card) return '<div class="mini-card unknown-card"><span class="unknown-count">?</span></div>';
  if (card.type === 'special') {
    const special = SPECIAL_CARDS[card.specialType];
    return '<div class="mini-card special-card" style="background:' + esc(special.bg) + ';color:' + esc(special.color) + '">' +
      '<div class="card-corner">' + esc(special.label) + '</div>' +
      '<div class="card-center"><span class="special-art">' + esc(special.icon) + '</span></div>' +
    '</div>';
  }
  const symbol = SUIT_SYMBOLS[card.suit];
  const color = SUIT_COLORS[card.suit];
  return '<div class="mini-card" style="color:' + esc(color) + '">' +
    '<div class="card-corner"><span class="card-rank">' + esc(rankLabel(card.rank)) + '</span><span class="card-suit">' + esc(symbol) + '</span></div>' +
    '<div class="card-center"><span class="card-suit-lg">' + esc(symbol) + '</span></div>' +
  '</div>';
}

function renderCardFaces(cardIds) {
  return Array.isArray(cardIds) && cardIds.length
    ? cardIds.map(renderMiniCard).join('')
    : '<span class="pass-chip">No cards</span>';
}

function renderCardBacks(count) {
  const n = Number.isFinite(Number(count)) ? Math.max(0, Number(count)) : 0;
  if (n <= 0) return '<span class="pass-chip">No visible hand</span>';
  const shown = Math.min(n, 10);
  const backs = Array.from({ length: shown }, (_, i) => {
    const label = i === shown - 1 && n > shown ? '+' + (n - shown + 1) : '';
    return '<div class="mini-card unknown-card"><span class="unknown-count">' + esc(label) + '</span></div>';
  }).join('');
  return backs;
}

function removePlayedFromHand(hand, playedCards) {
  if (!Array.isArray(hand) || !hand.length || !Array.isArray(playedCards) || !playedCards.length) return hand || [];
  const remaining = [...playedCards];
  return hand.filter(id => {
    const idx = remaining.indexOf(id);
    if (idx === -1) return true;
    remaining.splice(idx, 1);
    return false;
  });
}

function playedCardsForEvent(ev) {
  return cardsFromCombination(eventDataFor(ev)?.combination);
}

function positionFromPlay(play) {
  return play?.playerPosition ?? play?.position ?? null;
}

function cardsFromPlay(play) {

function renderReviewOptions(statuses, selected) {

function reportStatusPriority(status) {
  const s = status || 'unreviewed';
  if (s === 'valid_mistake') return 5;
  if (s === 'unclear') return 4;
  if (s === 'unreviewed') return 3;
  if (s === 'not_bug') return 2;
  if (s === 'duplicate') return 1;
  return 0;
}

function reportTimestamp(report) {
  const time = Date.parse(report?.created_at || '');
  return Number.isFinite(time) ? time : 0;
}

function reporterName(report) {
  return report?.reporter_name || ('User ' + report?.reporter_user_id);
}

function uniqueValues(values) {
  const seen = new Set();
  const out = [];
  values.forEach(value => {
    if (value == null || value === '') return;
    const key = String(value);
    if (seen.has(key)) return;
    seen.add(key);
    out.push(key);
  });
  return out;
}

function reportIdLabel(report) {
  const ids = report.report_ids || [report.id];
  return ids.map(id => '#' + id).join('/');
}

function fixedInfoForReport(report) {
  const ids = report.report_ids || [report.id];
  const seen = new Set();
  const fixes = [];
  ids.forEach(id => {
    const fix = FIXED_REPORT_LOOKUP.get(Number(id));
    if (!fix || seen.has(fix.title)) return;
    seen.add(fix.title);
    fixes.push(fix);
  });
  return fixes;
}

function renderFixedButton(report) {
  const fixes = fixedInfoForReport(report);
  if (fixes.length === 0) return '';
  const label = fixes.length > 1 ? 'Fixed ' + fixes.length : 'Fixed';
  return '<button class="fixed-pill" type="button" onclick="toggleFixedNote(' + report.id + ')">' + esc(label) + '</button>';
}

function renderFixedNote(report) {
  const fixes = fixedInfoForReport(report);
  if (fixes.length === 0) return '';
  return '<div class="fixed-note" id="fixed-note-' + report.id + '" hidden>' +

      '<div>' +
        '<div class="fixed-note-title">' + esc(fix.title) + '</div>' +
        '<div class="fixed-note-body">' + esc(fix.summary) + '</div>' +

}

function toggleFixedNote(reportId) {

function groupReportsByEvent(reports) {
  const groups = new Map();
  reports.forEach(report => {
    const key = report.game_event_id || report.id;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(report);
  });

  return Array.from(groups.values()).map(groupReports => {
    const sortedReports = [...groupReports].sort((a, b) => reportTimestamp(b) - reportTimestamp(a));
    const canonical = [...groupReports].sort((a, b) => {
      const priorityDiff = reportStatusPriority(b.review_status) - reportStatusPriority(a.review_status);
      if (priorityDiff !== 0) return priorityDiff;
      return reportTimestamp(b) - reportTimestamp(a);
    })[0];
    const reporterNames = uniqueValues(sortedReports.map(reporterName));
    const statuses = uniqueValues(sortedReports.map(r => r.review_status || 'unreviewed'))
      .sort((a, b) => reportStatusPriority(b) - reportStatusPriority(a));
    const notes = sortedReports
      .filter(r => r.review_note)
      .map(r => reportIdLabel({ report_ids: [r.id], id: r.id }) + ' ' + (REVIEW_LABELS[r.review_status] || r.review_status || 'unreviewed') + ': ' + r.review_note);

    return {
      ...canonical,
      created_at: sortedReports[0]?.created_at || canonical.created_at,
      report_count: sortedReports.length,
      report_ids: sortedReports.map(r => r.id),
      reporter_names: reporterNames,
      review_statuses: statuses,
      review_notes: notes,
      reports: sortedReports,
    };
  }).sort((a, b) => reportTimestamp(b) - reportTimestamp(a));
}

function renderStatusBadges(report) {

function renderBotReports(data) {
  const statuses = data.reviewStatuses || Object.keys(REVIEW_LABELS);
  const grouped = data.grouped || [];
  const recent = groupReportsByEvent(data.recent || []);
  const totalReports = grouped.reduce((sum, g) => sum + Number(g.total_reports || 0), 0);
  const unreviewed = grouped.reduce((sum, g) => sum + Number(g.unreviewed_reports || 0), 0);
  const duplicateCount = recent.reduce((sum, r) => sum + Math.max(0, Number(r.report_count || 1) - 1), 0);
  const fixedCount = recent.filter(r => fixedInfoForReport(r).length > 0).length;

  const groupedHtml = grouped.length
    ? '<table><tr><th>Branch</th><th>Tier</th><th>Reporters</th><th>Total</th><th>Unreviewed</th><th>Last</th></tr>' +
      grouped.map(g => '<tr><td>' + esc(g.branch_tag || '(MC/no tag)') + '</td><td>' + esc(g.bot_tier) + '</td><td>' + g.distinct_reporters + '</td><td>' + g.total_reports + '</td><td>' + g.unreviewed_reports + '</td><td title="'+esc(g.last_reported_at)+'">' + ago(g.last_reported_at) + '</td></tr>').join('') +
      '</table>'
    : '<div class="empty">No grouped reports yet</div>';

  const cardsHtml = recent.length
    ? recent.map(r => {
      const bot = botInfoFromRow(r);
      const status = r.review_status || 'unreviewed';
      const branch = r.branch_tag || bot?.branchTag || '(MC/no tag)';
      const hand = bot?.hand ? bot.hand.join(' ') : '-';
      const note = r.review_note || '';
      const reporterText = r.reporter_names?.length ? r.reporter_names.join(', ') : reporterName(r);
      const statusText = r.review_statuses?.length ? r.review_statuses.map(s => REVIEW_LABELS[s] || s).join(', ') : (REVIEW_LABELS[status] || status);
      const notesText = r.review_notes?.length ? r.review_notes.join(' | ') : '-';
      return '<div class="report-card" id="report-card-' + r.id + '">' +
        '<div class="report-card-header">' +
          '<div>' +
            '<div class="report-title">' +
              '<strong>Report ' + esc(reportIdLabel(r)) + '</strong>' +
              (Number(r.report_count) > 1 ? '<span class="badge badge-blue">' + r.report_count + ' reports</span>' : '') +
              '<span id="review-badges-' + r.id + '">' + renderStatusBadges(r) + '</span>' +
              renderFixedButton(r) +
              '<span class="badge badge-blue">' + esc(r.event_type) + '</span>' +
              '<span class="badge badge-yellow">' + esc(r.room_code) + '</span>' +
            '</div>' +
            '<div class="report-meta">Reported by ' + esc(reporterText) + ' · latest ' + ago(r.created_at) + ' · event #' + r.game_event_id + '</div>' +
          '</div>' +
          '<button class="report-context-btn" onclick="loadReportContext(' + r.id + ')">Show ±3 plays</button>' +
        '</div>' +
        renderFixedNote(r) +
        '<div class="report-grid">' +
          '<div class="report-field"><div class="report-field-label">Reporters</div><div class="report-field-value">' + esc(reporterText) + '</div></div>' +
          '<div class="report-field"><div class="report-field-label">Review statuses</div><div class="report-field-value">' + esc(statusText) + '</div></div>' +
          '<div class="report-field"><div class="report-field-label">Branch</div><div class="report-field-value">' + esc(branch) + '</div></div>' +
          '<div class="report-field"><div class="report-field-label">Tier</div><div class="report-field-value">' + esc(r.bot_tier || bot?.tier || '-') + '</div></div>' +
          '<div class="report-field"><div class="report-field-label">Reported move</div><div class="report-field-value">' + esc(summarizeEventRow(r)) + '</div></div>' +
          '<div class="report-field"><div class="report-field-label">Bot hand</div><div class="report-field-value">' + esc(hand) + '</div></div>' +
          '<div class="report-field"><div class="report-field-label">Review notes</div><div class="report-field-value">' + esc(notesText) + '</div></div>' +
        '</div>' +

          '<div><button onclick="saveReportReview(' + r.id + ', [' + r.report_ids.join(',') + '])">Save review</button><div class="review-msg" id="review-msg-' + r.id + '"></div></div>' +
        '</div>' +
        '<div class="report-context" id="report-context-' + r.id + '"></div>' +
      '</div>';
    }).join('')
    : '<div class="empty">No reported plays yet</div>';

  return '<div class="reports-wrap">' +
    '<div class="reports-heading"><h2>Reported Bot Plays</h2><div class="reports-hint">' + totalReports + ' total · ' + recent.length + ' unique plays · ' + fixedCount + ' fixed · ' + duplicateCount + ' duplicate reports grouped · ' + unreviewed + ' unreviewed</div></div>' +

      if (!data.length) { panel.innerHTML = '<div class="empty">No events yet</div>'; return; }
      panel.innerHTML = '<table><tr><th>Time</th><th>Room</th><th>Event</th><th>Player</th><th>Data</th></tr>' +
        data.map(r => '<tr><td title="'+esc(r.created_at)+'">' + ago(r.created_at) + '</td><td>' + esc(r.room_code) + '</td><td><span class="badge badge-blue">' + esc(r.event_type) + '</span></td><td>' + (r.player_position!=null ? 'P'+r.player_position : '-') + '</td><td title="'+esc(r.data)+'">' + esc(r.data?.slice(0,80)) + '</td></tr>').join('') + '</table>';
    }
    else if (name === 'botreports') {
      const data = await api('bot-reports?limit=100');
      panel.innerHTML = renderBotReports(data);
    }
    else if (name === 'requests') {
      const data = await api('requests?limit=200');
      if (!data.length) { panel.innerHTML = '<div class="empty">No requests yet</div>'; return; }
      panel.innerHTML = '<table><tr><th>Time</th><th>Method</th><th>Path</th><th>IP</th><th>Status</th><th>Time (ms)</th></tr>' +
        data.map(r => '<tr><td title="'+esc(r.created_at)+'">' + ago(r.created_at) + '</td><td>' + esc(r.method) + '</td><td>' + esc(r.path) + '</td><td>' + esc(r.ip) + '</td><td><span class="badge ' + (r.status_code<400?'badge-green':'badge-red') + '">' + r.status_code + '</span></td><td>' + (r.response_time_ms||'-') + '</td></tr>').join('') + '</table>';
    }
    else if (name === 'ips') {
      const data = await api('top-ips?limit=30');
      if (!data.length) { panel.innerHTML = '<div class="empty">No data yet</div>'; return; }
      panel.innerHTML = '<table><tr><th>IP Address</th><th>Connections</th><th>Nicknames Used</th><th>Last Seen</th></tr>' +
        data.map(r => '<tr><td><strong>' + esc(r.ip) + '</strong></td><td>' + r.connection_count + '</td><td>' + esc(r.nicknames) + '</td><td title="'+esc(r.last_seen)+'">' + ago(r.last_seen) + '</td></tr>').join('') + '</table>';
    }
    else if (name === 'users') {
      if (panel.querySelector('.user-form')) return;
      panel.innerHTML = '<div class="user-form">' +
        '<h3 style="color:#c9a84c;margin-bottom:1rem;font-size:1rem;">Reset User Password</h3>' +
        '<label for="reset-identifier">Username or Email</label>' +
        '<input type="text" id="reset-identifier" placeholder="username or user@example.com" autocomplete="off">' +
        '<label for="reset-password">New Password</label>' +
        '<input type="password" id="reset-password" placeholder="minimum 8 characters" autocomplete="new-password">' +
        '<button onclick="resetUserPassword()" id="reset-btn">Reset Password</button>' +
        '<div id="reset-msg"></div></div>';
    }
    else if (name === 'query') {
      if (panel.querySelector('textarea')) return;
      const tables = await api('tables');
      panel.innerHTML = '<div class="query-wrap">' +
        '<div class="query-chips">' + tables.map(t => '<span class="chip" onclick="setQuery(\'SELECT * FROM '+t.name+'\')">' + t.name + '<span class="count">(' + t.rowCount + ')</span></span>').join('') + '</div>' +
        '<textarea id="sql-input" placeholder="SELECT * FROM players ORDER BY games_won DESC" spellcheck="false"></textarea>' +
        '<div class="query-bar">' +
          '<button onclick="runQuery()">Run Query</button>' +
          '<button class="btn-secondary" onclick="exportCSV()">Export CSV</button>' +
          '<span class="query-info" id="query-info"></span>' +
        '</div>' +
        '<div id="query-result"></div></div>';
    }
  } catch(e) {
    const message = e instanceof Error ? e.message : 'Request failed';
    panel.innerHTML = '<div class="empty">Error loading data: ' + esc(message) + '</div>';
  }
}

function renderTimelineEvent(ev) {
  const data = parseJson(ev.data);
  const bot = data?.bot || null;
  const offsetLabel = ev.offset === 0 ? 'Reported' : (ev.offset > 0 ? '+' + ev.offset : String(ev.offset));
  const branch = bot?.branchTag ? ' · ' + bot.branchTag : '';
  const hand = bot?.hand ? ' · hand: ' + bot.hand.join(' ') : '';
  const trick = bot?.currentTrickPlays ? ' · trick: ' + bot.currentTrickPlays.map(p => 'P' + p.position + '[' + p.cards.join(' ') + ']').join(' → ') : '';
  const scores = bot?.scores ? ' · score: ' + bot.scores.join(' - ') : '';
  return '<div class="timeline-event ' + (ev.offset === 0 ? 'reported' : '') + '">' +
    '<div class="timeline-offset">' + esc(offsetLabel) + '</div>' +
    '<div class="timeline-type">' + esc(ev.event_type) + '<div class="timeline-sub">P' + esc(ev.player_position ?? '-') + '</div></div>' +
    '<div class="timeline-body">' +
      '<div class="timeline-main">' + esc(summarizeEventRow(ev)) + '</div>' +
      '<div class="timeline-sub">' + esc('event #' + ev.id + ' · ' + ago(ev.created_at) + branch + scores) + '</div>' +
      (hand !== '' || trick !== '' ? '<div class="timeline-sub">' + esc((hand + trick).replace(/^ · /, '')) + '</div>' : '') +
    '</div>' +
  '</div>';
}

function renderReportContext(data) {
  if (data.error) return '<div class="query-error">' + esc(data.error) + '</div>';
  if (!data.events || !data.events.length) return '<div class="empty">No surrounding events found</div>';
  return '<div class="timeline">' + data.events.map(renderTimelineEvent).join('') + '</div>';
}

function renderCardList(cardIds) {
  if (!Array.isArray(cardIds) || cardIds.length === 0) return '<span class="replay-sub">No visible cards</span>';
  return cardIds.map(id => '<span class="card-chip">' + esc(id) + '</span>').join('');
}

function snapshotForEvent(ev) {
  return parseJson(ev.snapshot);
}

function eventDataFor(ev) {
  return parseJson(ev.data) || {};
}

function replayEvidenceBadge(ev, snapshot) {
  const data = eventDataFor(ev);
  const bot = data?.bot || null;
  if (snapshot) return '<span class="badge badge-green">Full state snapshot</span>';
  if (bot?.hand) return '<span class="badge badge-yellow">Legacy report · bot hand captured</span>';
  if (data?.combination) return '<span class="badge badge-blue">Legacy report · move only</span>';
  return '<span class="badge badge-muted">Legacy report · sparse event</span>';
}

function fallbackPlayersForEvent(ev) {
  const data = eventDataFor(ev);
  const bot = data?.bot || null;
  const playedCards = cardsFromCombination(data?.combination);
  return [0, 1, 2, 3].map(pos => ({
    position: pos,
    nickname: 'P' + pos,
    hand: bot && ev.player_position === pos && Array.isArray(bot.hand) ? bot.hand : [],
    playedCards: ev.player_position === pos ? playedCards : [],
    cardCount: bot?.oppCardCounts?.[pos] ?? null,
    isOut: Array.isArray(bot?.finishOrder) ? bot.finishOrder.includes(pos) : false,
    finishOrder: null,
    tichuCall: bot?.tichuCalls?.[pos] || 'unknown',
    evidence: bot && ev.player_position === pos && Array.isArray(bot.hand)
      ? 'captured bot hand before this decision'
      : (ev.player_position === pos && playedCards.length ? 'played cards captured' : 'card identities unavailable'),
  }));
}

function scenePlayersForEvent(ev, snapshot) {
  const playedCards = playedCardsForEvent(ev);
  const isCardMove = (ev.event_type === 'PLAY' || ev.event_type === 'BOMB') && playedCards.length > 0;
  return (snapshot?.players || fallbackPlayersForEvent(ev)).map(p => {
    const originalHand = Array.isArray(p.hand) ? p.hand : [];
    const acted = p.position === ev.player_position;
    const visibleHand = acted && isCardMove ? removePlayedFromHand(originalHand, playedCards) : originalHand;
    const originalCount = p.cardCount ?? originalHand.length;
    const visibleCount = acted && isCardMove && Number.isFinite(Number(originalCount))
      ? Math.max(0, Number(originalCount) - playedCards.length)
      : originalCount;
    return { ...p, visibleHand, visibleCount, acted };
  });
}

function renderReplaySeat(p, ev, snapshot) {
  const hasKnownHand = Array.isArray(p.visibleHand) && p.visibleHand.length > 0;
  const hasFullSnapshot = !!snapshot;
  const handHtml = hasKnownHand
    ? renderCardFaces(p.visibleHand)
    : renderCardBacks(p.visibleCount);
  const classes = [
    'replay-seat',
    'pos-' + p.position,
    p.position === (snapshot?.currentPlayer ?? ev.player_position) ? 'current' : '',
    ev.offset === 0 && p.position === ev.player_position ? 'reported-player' : '',
    p.acted ? 'actor' : '',
  ].filter(Boolean).join(' ');
  const teamClass = p.position === 0 || p.position === 2 ? 'team-a' : 'team-b';
  const source = hasFullSnapshot
    ? 'full hand'
    : (hasKnownHand ? 'captured bot hand' : 'unknown cards shown as backs');
  return '<div class="' + classes + '">' +
    '<div class="replay-seat-head">' +
      '<div class="replay-seat-name"><span class="seat-dot ' + teamClass + '"></span><strong>P' + p.position + ' · ' + esc(p.nickname || ('Player ' + p.position)) + '</strong></div>' +
      '<span>' + esc(p.visibleCount ?? '?') + ' card' + (Number(p.visibleCount) === 1 ? '' : 's') + '</span>' +
    '</div>' +
    '<div class="replay-seat-sub">' + esc(p.tichuCall || 'none') + (p.isOut ? ' · out' : '') + (p.acted ? ' · acted' : '') + ' · ' + esc(source) + '</div>' +
    '<div class="replay-seat-hand ' + (hasKnownHand ? 'known' : 'unknown') + '">' + handHtml + '</div>' +
  '</div>';
}

function trickPlaysForScene(ev, snapshot) {
  const data = eventDataFor(ev);
  const bot = data?.bot || null;
  const base = snapshot?.currentTrick?.plays?.length
    ? snapshot.currentTrick.plays.map(p => ({
        position: positionFromPlay(p),
        cards: cardsFromPlay(p),
        comboType: p.comboType,
        latest: false,
      }))
    : (Array.isArray(bot?.currentTrickPlays) ? bot.currentTrickPlays.map(p => ({
        position: positionFromPlay(p),
        cards: cardsFromPlay(p),
        comboType: p.comboType,
        latest: false,
      })) : []);
  const playedCards = playedCardsForEvent(ev);
  if ((ev.event_type === 'PLAY' || ev.event_type === 'BOMB') && playedCards.length) {
    base.push({
      position: ev.player_position,
      cards: playedCards,
      comboType: data?.combination?.type || ev.event_type,
      latest: true,
    });
  }
  return base;
}

function renderReplayTrick(ev, snapshot) {
  const plays = trickPlaysForScene(ev, snapshot);
  const latestPass = ev.event_type === 'PASS';
  if (!plays.length && !latestPass) {
    return '<div class="replay-table-sub">No cards in the trick yet</div>';
  }
  return '<div class="replay-trick-pile">' +
    plays.map(play => '<div class="replay-trick-play ' + (play.latest ? 'latest' : '') + '">' +
      '<div class="trick-seat-label">P' + esc(play.position ?? '-') + (play.latest ? ' now' : '') + '</div>' +
      '<div class="trick-card-row">' + renderCardFaces(play.cards) + '</div>' +
    '</div>').join('') +
    (latestPass ? '<div class="replay-trick-play latest"><div class="trick-seat-label">P' + esc(ev.player_position ?? '-') + ' now</div><div><span class="pass-chip">PASS</span></div></div>' : '') +
  '</div>';
}

function renderReplayGameRoom(ev, snapshot) {
  const data = eventDataFor(ev);
  const bot = data?.bot || null;
  const players = scenePlayersForEvent(ev, snapshot);
  const scores = snapshot?.scores ? snapshot.scores : bot?.scores;
  const wish = snapshot?.wish?.active ? snapshot.wish.wishedRank : (bot?.wish?.active ? bot.wish.wishedRank : null);
  const action = summarizeEventRow(ev);
  return '<div class="replay-game-room">' +
    '<div class="replay-score-strip">' +
      '<strong>Team 0/2: ' + esc(scores ? scores[0] : '-') + '</strong>' +
      '<span>' + replayEvidenceBadge(ev, snapshot) + '</span>' +
      '<strong>Team 1/3: ' + esc(scores ? scores[1] : '-') + '</strong>' +
    '</div>' +
    '<div class="replay-board">' +
      players.map(p => renderReplaySeat(p, ev, snapshot)).join('') +
      '<div class="replay-table-center">' +
        '<div class="replay-table-title">' + esc(action) + '</div>' +
        '<div class="replay-table-sub">Current trick' + (wish ? ' · wish ' + esc(wish) : '') + '</div>' +
        renderReplayTrick(ev, snapshot) +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderReplayMeta(ev, snapshot) {
  const data = eventDataFor(ev);
  const bot = data?.bot || null;
  const rows = [
    ['Room', ev.room_code || '-'],
    ['Score', snapshot?.scores ? snapshot.scores.join(' - ') : (bot?.scores ? bot.scores.join(' - ') : '-')],
    ['Phase', snapshot?.phase || '-'],
    ['Current trick', snapshot?.currentTrick?.plays?.length ? snapshot.currentTrick.plays.map(p => 'P' + p.playerPosition + '[' + p.cards.join(' ') + ']').join(' -> ') : formatTrickPlays(bot?.currentTrickPlays)],
    ['Wish', snapshot?.wish?.active ? snapshot.wish.wishedRank : (bot?.wish?.active ? bot.wish.wishedRank : '-')],
    ['Branch', bot?.branchTag || '-'],
    ['Tier', bot?.tier || '-'],
    ['Trick top', formatTrickTop(bot?.trickTop)],
    ['Trick points', bot?.trickPoints ?? '-'],
    ['Current winner', snapshot?.currentTrick?.currentWinner != null ? 'P' + snapshot.currentTrick.currentWinner : (bot?.currentWinner != null ? 'P' + bot.currentWinner : '-')],
    ['Pass count', snapshot?.currentTrick?.passCount ?? bot?.passCount ?? '-'],
    ['Finish order', snapshot?.finishOrder?.length ? formatPlayerList(snapshot.finishOrder) : formatPlayerList(bot?.finishOrder)],
  ];
  return '<div class="replay-meta-grid">' + rows.map(([label, value]) =>
    '<div class="report-field"><div class="report-field-label">' + esc(label) + '</div><div class="report-field-value">' + esc(value) + '</div></div>'
  ).join('') + '</div>';
}

function renderLegacyEvidence(ev, snapshot) {
  const data = eventDataFor(ev);
  const bot = data?.bot || null;
  const playedCards = cardsFromCombination(data?.combination);
  const fields = [
    ['Played cards', playedCards.length ? playedCards.join(' ') : '-'],
    ['Combination', data?.combination ? summarizeEventRow(ev) : '-'],
    ['Bot hand before move', Array.isArray(bot?.hand) && bot.hand.length ? bot.hand.join(' ') : '-'],
    ['Opponent card counts', formatPlayerMap(bot?.oppCardCounts)],
    ['Tichu calls', formatPlayerMap(bot?.tichuCalls)],
    ['Current trick plays', formatTrickPlays(bot?.currentTrickPlays)],
    ['Wish', bot?.wish?.active ? bot.wish.wishedRank : '-'],
  ];
  const raw = Object.keys(data).length ? JSON.stringify(data, null, 2) : '';
  return '<details class="replay-evidence">' +
    '<summary>Evidence details</summary>' +
    '<div class="replay-evidence-head">' +
      '<strong>' + (snapshot ? 'Captured Event Evidence' : 'Legacy Evidence') + '</strong>' +
      replayEvidenceBadge(ev, snapshot) +
    '</div>' +
    '<div class="replay-meta-grid">' + fields.map(([label, value]) =>
      '<div class="report-field"><div class="report-field-label">' + esc(label) + '</div><div class="report-field-value">' + esc(value) + '</div></div>'
    ).join('') + '</div>' +
    (raw ? '<details><summary>Raw event data</summary><pre class="raw-json">' + esc(raw) + '</pre></details>' : '') +
  '</details>';
}

function renderReplayRoom() {
  const target = document.getElementById('report-replay-room');
  if (!target || !replayState) return;
  const events = replayState.events || [];
  if (!events.length) {
    target.innerHTML = '<div class="empty">No replayable PLAY/PASS/BOMB moves found around this report</div>';
    return;
  }

  const ev = events[replayState.index];
  const snapshot = snapshotForEvent(ev);
  const snapshotNote = replayEvidenceBadge(ev, snapshot);
  const offsetLabel = ev.offset === 0 ? 'Reported move' : (ev.offset > 0 ? '+' + ev.offset + ' after report' : ev.offset + ' before report');
  target.innerHTML = '<div class="replay-stage ' + (ev.offset === 0 ? 'reported ' : '') + (snapshot ? '' : 'legacy') + '">' +
    '<div class="replay-head">' +
      '<div class="replay-title">' +
        '<strong>Move ' + (replayState.index + 1) + ' of ' + events.length + ' · ' + esc(offsetLabel) + '</strong>' +
        '<span class="replay-sub">Event #' + ev.id + ' · ' + esc(ev.event_type) + ' · P' + esc(ev.player_position ?? '-') + ' · ' + ago(ev.created_at) + '</span>' +
      '</div>' +
      '<div class="replay-controls">' +
        snapshotNote +
        '<button onclick="previousReplayMove()" ' + (replayState.index <= 0 ? 'disabled' : '') + '>Previous</button>' +
        '<button onclick="nextReplayMove()" ' + (replayState.index >= events.length - 1 ? 'disabled' : '') + '>Next</button>' +
      '</div>' +
    '</div>' +
    renderReplayGameRoom(ev, snapshot) +
    '<details class="replay-evidence"><summary>Replay metadata</summary>' + renderReplayMeta(ev, snapshot) + '</details>' +
    renderLegacyEvidence(ev, snapshot) +
  '</div>';
}

async function startReportReplay() {
  const select = document.getElementById('report-test-select');
  const target = document.getElementById('report-replay-room');
  if (!select || !target) return;
  target.innerHTML = '<div class="empty">Loading replay...</div>';
  try {
    const data = await api('bot-reports/' + select.value + '/replay?radius=3');
    replayState = { ...data, index: 0 };
    renderReplayRoom();
  } catch(e) {
    const message = e instanceof Error ? e.message : 'Replay failed';
    target.innerHTML = '<div class="query-error">' + esc(message) + '</div>';
  }
}

function nextReplayMove() {
  if (!replayState) return;
  replayState.index = Math.min((replayState.events?.length || 1) - 1, replayState.index + 1);
  renderReplayRoom();
}

function previousReplayMove() {
  if (!replayState) return;
  replayState.index = Math.max(0, replayState.index - 1);
  renderReplayRoom();
}

async function loadReportContext(reportId) {
  const target = document.getElementById('report-context-' + reportId);
  if (!target) return;
  target.innerHTML = '<div class="empty">Loading surrounding plays...</div>';
  try {
    const data = await api('bot-reports/' + reportId + '/context?radius=3');
    target.innerHTML = renderReportContext(data);
  } catch(e) {
    target.innerHTML = '<div class="query-error">Could not load context</div>';
  }
}

async function saveReportReview(reportId, reportIds) {
  const status = document.getElementById('review-status-' + reportId)?.value;
  const note = document.getElementById('review-note-' + reportId)?.value || '';
  const msg = document.getElementById('review-msg-' + reportId);
  const ids = Array.isArray(reportIds) && reportIds.length ? reportIds : [reportId];
  if (msg) msg.textContent = 'Saving...';
  try {
    for (const id of ids) {
      const res = await fetch('/admin/api/bot-reports/' + id + '/review', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ status, note }),
      });
      const data = await res.json();
      if (data.error) {
        if (msg) msg.textContent = data.error;
        return;
      }
    }
    const badges = document.getElementById('review-badges-' + reportId);
    if (badges) badges.innerHTML = '<span class="badge ' + reviewBadgeClass(status) + '" id="review-badge-' + reportId + '">' + esc(REVIEW_LABELS[status] || status) + '</span>';
    const badge = document.getElementById('review-badge-' + reportId);
    if (badge) {
      badge.className = 'badge ' + reviewBadgeClass(status);
      badge.textContent = REVIEW_LABELS[status] || status;
    }
    if (msg) msg.textContent = ids.length > 1 ? 'Saved ' + ids.length + ' reports' : 'Saved';
  } catch(e) {
    if (msg) msg.textContent = 'Save failed';
  }
}

let lastQueryResult = null;

function setQuery(sql) {
  const el = document.getElementById('sql-input');
  if (el) { el.value = sql; runQuery(); }
}

async function runQuery() {
  const sql = document.getElementById('sql-input')?.value?.trim();
  const result = document.getElementById('query-result');
  const info = document.getElementById('query-info');
  if (!sql) return;
  info.textContent = 'Running...';
  try {
    const res = await fetch('/admin/api/query', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({sql, limit: 500}) });
    const data = await res.json();
    if (data.error) { result.innerHTML = '<div class="query-error">' + esc(data.error) + '</div>'; info.textContent = ''; return; }
    lastQueryResult = data;
    info.textContent = data.rowCount + ' row' + (data.rowCount !== 1 ? 's' : '');
    if (!data.columns.length) { result.innerHTML = '<div class="empty">No results</div>'; return; }
    result.innerHTML = '<table><tr>' + data.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>' +
      data.rows.map(r => '<tr>' + r.map(v => '<td title="'+esc(v)+'">' + esc(v) + '</td>').join('') + '</tr>').join('') + '</table>';
  } catch(e) { result.innerHTML = '<div class="query-error">Request failed</div>'; info.textContent = ''; }
}

function exportCSV() {
  if (!lastQueryResult || !lastQueryResult.columns.length) return;
  const csvEsc = v => { const s = v == null ? '' : String(v); return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [lastQueryResult.columns.join(','), ...lastQueryResult.rows.map(r => r.map(csvEsc).join(','))];
  const blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'query-results.csv'; a.click();
}

async function resetUserPassword() {
  const identifier = document.getElementById('reset-identifier')?.value?.trim();
  const newPassword = document.getElementById('reset-password')?.value;
  const msg = document.getElementById('reset-msg');
  const btn = document.getElementById('reset-btn');
  if (!identifier || !newPassword) { msg.innerHTML = '<div class="form-msg error">Both fields are required</div>'; return; }
  if (newPassword.length < 8) { msg.innerHTML = '<div class="form-msg error">Password must be at least 8 characters</div>'; return; }
  btn.disabled = true;
  msg.innerHTML = '';
  try {
    const res = await fetch('/admin/api/reset-user-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ identifier, newPassword })
    });
    const data = await res.json();
    if (data.error) {
      msg.innerHTML = '<div class="form-msg error">' + esc(data.error) + '</div>';
    } else {
      msg.innerHTML = '<div class="form-msg success">Password reset for <strong>' + esc(data.username) + '</strong></div>';
      document.getElementById('reset-password').value = '';
    }
  } catch(e) {
    msg.innerHTML = '<div class="form-msg error">Request failed</div>';
  }
  btn.disabled = false;
}

async function refresh(forcePanel = false) {
  if (isFilePreview) {
    renderFilePreviewNotice();
    return;
  }
  await loadStats();
  if (!isReportTesterOpen() || forcePanel) {
    await loadTab(currentTab);
    document.getElementById('last-refresh').textContent = new Date().toLocaleTimeString();
  } else {
    document.getElementById('last-refresh').textContent = 'stats only ' + new Date().toLocaleTimeString();
  }
}

refresh();
setInterval(refresh, 30000);
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && currentTab === 'query') { e.preventDefault(); runQuery(); } });
</script>
